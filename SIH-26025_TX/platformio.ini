; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Run Python script before build
extra_scripts = pre:scripts/train_model.py

; --- Serial Monitor Settings ---
monitor_speed = 115200
monitor_filters = 
    time        ; Adds timestamps to each line in monitor
    esp32_exception_decoder ; Decodes backtraces automatically on crash

; --- Compiler & Optimization Flags ---
build_flags = 
    -O2                       ; Optimize for speed
    -D CORE_DEBUG_LEVEL=3     ; Info-level serial debug logging (0=None, 3=Info, 5=Verbose)
    -I include                ; Explicitly ensure include/ is in compiler search path

; --- Partition Table & Flash Memory ---
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_cpu = 240000000L  ; Set CPU clock speed to 240 MHz

; --- Included Libraries ---
lib_deps = 
    sandeepmistry/LoRa @ ^0.8.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    tomstewart89/BasicLinearAlgebra @ ^5.1
    Wire
    SPI

; --- Upload Settings ---
upload_speed = 921600         ; Fast upload speed over USB Serial